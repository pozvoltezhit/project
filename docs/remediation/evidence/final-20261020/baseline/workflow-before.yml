name: Knowledge platform verification
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime once
        run: docker build -f infra/Dockerfile -t knowledge:candidate .
      - name: Build test tools on the candidate image
        run: docker build -f infra/Dockerfile.test --build-arg BASE_IMAGE=knowledge:candidate -t knowledge:tools .
      - name: Verify CPU and security with isolated SQL
        run: |
          mkdir -p docs/remediation/evidence
          docker run --rm -v "$PWD:/app" -e DB_PATH=/tmp/ci.db -e AUTH_FILE=/tmp/absent.json -e PYTHONDONTWRITEBYTECODE=1 -e MYPY_CACHE_DIR=/tmp/mypy -e COVERAGE_FILE=/tmp/.coverage --entrypoint python knowledge:tools tools/verify.py
          docker run --rm -v "$PWD:/app" -e DB_PATH=/tmp/eval.db --entrypoint python knowledge:tools -m backend.evaluate --output /app/docs/remediation/evidence/eval-cpu.json
      - name: Record unexecuted GPU/deployment stage
        run: |
          echo 'GPU integration/evaluation/smoke PENDING: this runner has no approved GPU/data-plane test environment.'
          echo 'Release remains HOLD until matching real CPU/GPU integration and image evidence are supplied.'
