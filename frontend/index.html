<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корпоративные знания</title><style>body{font:18px/1.55 system-ui;margin:40px auto;max-width:960px;padding:0 24px;color:#172336;background:#f7f8fa}label{display:block;margin-top:20px}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%}button{margin:16px 0;background:#193f68;color:white;border:0;border-radius:4px}pre{white-space:pre-wrap;word-break:break-word}article{border-bottom:1px solid #ccd3dc;padding:12px 0}small{color:#46576c}</style>
<h1>Корпоративные знания</h1><p>Поиск с проверкой доступа и ссылками на исходные документы</p>
<label for="token">Ключ доступа</label><input id="token" type="password" autocomplete="off">
<label for="question">Вопрос</label><textarea id="question" rows="3">Как связан насос Н-17 с датчиком Д-8?</textarea>
<button id="ask">Найти ответ</button><p id="status" role="status" aria-live="polite"></p><div id="result"></div><h2>Связи источников</h2><pre id="graph"></pre>
<script>const $=id=>document.getElementById(id);$('ask').onclick=async()=>{ $('ask').disabled=true;$('status').textContent='Поиск…';$('result').replaceChildren();$('graph').textContent='';try{const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify({question:$('question').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка запроса');$('status').textContent=d.status==='answered'?'Найдены подтверждённые источники. Режим: '+d.usage.mode:'Подтверждённый ответ отсутствует. Статус: '+d.status;for(const e of d.evidence){const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('small');p.textContent=e.quote;s.textContent=e.title+' · страница '+e.page+' · версия '+e.version;a.append(p,s);$('result').append(a)}$('graph').textContent=d.graph.map(e=>e.src+' — '+e.relation+' — '+e.dst+' ['+e.chunk_id+']').join('\n')}catch(e){$('status').textContent=e.message}finally{$('ask').disabled=false}};</script></html>
