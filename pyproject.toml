[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
files = ["backend/budget.py"]

[tool.coverage.run]
omit = ["backend/check.py", "backend/integration_check.py", "backend/benchmark.py", "backend/gpu_check.py", "backend/stack_check.py"]
