pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 32k;
    proxy_read_timeout 45s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend_pool { zone backend_pool 64k; server backend:8000 resolve; }
    upstream jaeger_pool { zone jaeger_pool 64k; server jaeger:16686 resolve; }
    upstream neo4j_pool { zone neo4j_pool 64k; server neo4j:7474 resolve; }
    upstream prometheus_pool { zone prometheus_pool 64k; server prometheus:9090 resolve; }
    upstream grafana_pool { zone grafana_pool 64k; server grafana:3000 resolve; }
    server { listen 18080; location / { proxy_pass http://backend_pool; } }
    server { listen 16686; location / { proxy_pass http://jaeger_pool; } }
    server { listen 17474; location / { proxy_pass http://neo4j_pool; } }
    server { listen 19090; location / { proxy_pass http://prometheus_pool; } }
    server { listen 13000; location / { proxy_pass http://grafana_pool; } }
}
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream bolt_pool { zone bolt_pool 64k; server neo4j:7687 resolve; }
    server { listen 17687; proxy_pass bolt_pool; }
}
