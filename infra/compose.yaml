name: course-knowledge
services:
  backend:
    build: {context: .., dockerfile: infra/Dockerfile}
    volumes: ["../data:/app/data"]
    environment:
      DB_PATH: /app/data/knowledge.db
      AUTH_FILE: /app/data/identities.json
      KNOWLEDGE_OTLP_ENDPOINT: http://jaeger:4318
      LANGSMITH_TRACING: "false"
      LANGSMITH_OTEL_ENABLED: "false"
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 120s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment: {QDRANT__TELEMETRY_DISABLED: "true"}
    volumes: [qdrant:/qdrant/storage]
    networks: [internal]
  neo4j:
    image: neo4j:5.26-community
    environment: {NEO4J_dbms_usage__report_enabled: "false"}
    volumes: [neo4j:/data, "../data/neo4j-password.txt:/run/secrets/neo4j-password:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command: ["export NEO4J_AUTH=neo4j/$$(cat /run/secrets/neo4j-password); exec /startup/docker-entrypoint.sh neo4j"]
    networks: [internal]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    command: ["--memory.max-traces=10000"]
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    networks: [internal]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro"]
    networks: [internal]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes: ["./grafana:/etc/grafana/provisioning:ro"]
    networks: [internal]
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:18080:18080", "127.0.0.1:16686:16686", "127.0.0.1:17474:17474", "127.0.0.1:17687:17687", "127.0.0.1:19090:19090", "127.0.0.1:13000:13000"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [internal, edge]
    depends_on:
      backend: {condition: service_healthy}
      neo4j: {condition: service_started}
      jaeger: {condition: service_started}
      prometheus: {condition: service_started}
      grafana: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes: {qdrant: {}, neo4j: {}}
networks:
  internal: {internal: true}
  edge: {}
